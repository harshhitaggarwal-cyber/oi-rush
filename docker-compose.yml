services:
  api:
    build:
      context: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      OI_RUSH_DB_PATH: /data/oi_rush.sqlite3
    volumes:
      - oi-rush-data:/data
    restart: unless-stopped
  snapshot-worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.scheduler"]
    env_file:
      - ./backend/.env
    environment:
      OI_RUSH_DB_PATH: /data/oi_rush.sqlite3
    volumes:
      - oi-rush-data:/data
    restart: unless-stopped
volumes:
  oi-rush-data:
